services:
  - type: web
    name: quick-money-api
    runtime: node
    plan: free
    region: singapore
    rootDir: Backend
    buildCommand: npm install
    startCommand: node src/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_DIALECT
        value: mysql
      - key: DB_HOST
        value: jewellery-db-dk5758769-b125.f.aivencloud.com
      - key: DB_PORT
        value: "22890"
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: "true"
      - key: BREVO_FROM_NAME
        value: Quick Money Security
      - key: BREVO_FROM_EMAIL
        value: quick.moneey.in@gmail.com
      - key: EMAIL_USER
        value: quick.moneey.in@gmail.com
      - key: EMAIL_APP_PASSWORD
        value: "zowi plsgaqieqpkk"
      - key: AES_SECRET_KEY
        sync: false
      - key: AES_IV
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: PROFIT_RETURN_THRESHOLD
        value: "100.00"
      - key: MIN_WITHDRAWAL_LIMIT
        value: "100.00"
      - key: DAILY_YIELD_RATE
        value: "0.025"
      - key: WELCOME_BONUS
        value: "51.07"
